<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(80 160)">
    <!-- Pieza 1 (puerta) -->
    <rect x="0" y="0" width="100" height="40" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" rx="4"/>
    <rect x="10" y="10" width="80" height="20" fill="#E2E8F0" rx="2"/>
    <circle cx="80" cy="20" r="3" fill="#DC2626"/>
    <text x="50" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Sensor</text>
    <!-- Espacio -->
    <!-- Pieza 2 (marco) -->
    <rect x="140" y="0" width="100" height="40" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" rx="4"/>
    <rect x="150" y="10" width="80" height="20" fill="#E2E8F0" rx="2"/>
    <text x="190" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Imán</text>
  </g>
  <!-- Líneas magnéticas -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4 4">
    <path d="M 180 180 Q 200 160 220 180"/>
    <path d="M 180 200 Q 200 215 220 200"/>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Sensor Magnético</text>
</svg>
