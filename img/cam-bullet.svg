<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(80 130)">
    <!-- Soporte -->
    <rect x="100" y="0" width="40" height="30" fill="#475569" rx="4"/>
    <rect x="115" y="25" width="10" height="20" fill="#334155"/>
    <!-- Cuerpo cilíndrico -->
    <rect x="20" y="40" width="200" height="80" fill="#1E293B" rx="20"/>
    <rect x="20" y="40" width="200" height="20" fill="#0F172A" rx="20"/>
    <!-- Visera -->
    <rect x="10" y="55" width="40" height="50" fill="#334155" rx="6"/>
    <!-- Lente -->
    <circle cx="60" cy="80" r="22" fill="#0F172A"/>
    <circle cx="60" cy="80" r="18" fill="#1E293B"/>
    <circle cx="60" cy="80" r="14" fill="#0B2545"/>
    <circle cx="55" cy="75" r="4" fill="#3B82F6" opacity="0.6"/>
    <!-- LED IR -->
    <circle cx="100" cy="80" r="4" fill="#DC2626"/>
    <circle cx="120" cy="80" r="4" fill="#DC2626"/>
    <circle cx="140" cy="80" r="4" fill="#DC2626"/>
    <circle cx="160" cy="80" r="4" fill="#DC2626"/>
    <!-- Label -->
    <rect x="180" y="92" width="30" height="14" fill="#475569" rx="2"/>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Cámara Bullet IP</text>
</svg>
