<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(60 100)">
    <!-- Cuerpo monitor -->
    <rect x="0" y="0" width="280" height="200" fill="#1E293B" rx="12"/>
    <rect x="6" y="6" width="268" height="188" fill="#0F172A" rx="9"/>
    <!-- Pantalla grande -->
    <rect x="20" y="20" width="240" height="140" fill="#0B2545" rx="4"/>
    <rect x="20" y="20" width="240" height="140" fill="url(#monGrad2)" rx="4"/>
    <!-- Vista de cámara -->
    <circle cx="140" cy="65" r="20" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 110 120 Q 110 95 140 95 Q 170 95 170 120 L 170 145 L 110 145 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Esquinas IA -->
    <g stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 110 40 L 110 30 L 120 30"/>
      <path d="M 170 30 L 180 30 L 180 40"/>
      <path d="M 110 140 L 110 150 L 120 150"/>
      <path d="M 170 150 L 180 150 L 180 140"/>
    </g>
    <!-- Info HUD -->
    <g fill="#00D4FF" font-family="monospace" font-size="9">
      <text x="32" y="35">14:32</text>
      <text x="32" y="155">PUERTA 01</text>
    </g>
    <text x="240" y="35" text-anchor="end" font-family="monospace" font-size="9" fill="#10B981">● REC</text>
    <!-- Botones inferiores -->
    <g>
      <circle cx="50" cy="180" r="10" fill="#10B981"/>
      <circle cx="100" cy="180" r="10" fill="#475569"/>
      <circle cx="150" cy="180" r="10" fill="#475569"/>
      <circle cx="200" cy="180" r="10" fill="#475569"/>
      <circle cx="250" cy="180" r="10" fill="#DC2626"/>
    </g>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Monitor Interior</text>
</svg>
