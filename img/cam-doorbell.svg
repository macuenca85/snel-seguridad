<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(140 70)">
    <!-- Cuerpo timbre vertical -->
    <rect x="0" y="0" width="120" height="260" fill="#1E293B" rx="14"/>
    <rect x="5" y="5" width="110" height="250" fill="#334155" rx="11"/>
    <!-- Cámara superior -->
    <circle cx="60" cy="55" r="32" fill="#0F172A"/>
    <circle cx="60" cy="55" r="24" fill="#020617"/>
    <circle cx="60" cy="55" r="16" fill="#0B2545"/>
    <circle cx="54" cy="49" r="4" fill="#3B82F6" opacity="0.7"/>
    <!-- LED indicador -->
    <circle cx="60" cy="105" r="4" fill="#00D4FF"/>
    <!-- Sensor PIR -->
    <rect x="40" y="120" width="40" height="20" fill="#0F172A" rx="3"/>
    <!-- Botón timbre principal grande -->
    <circle cx="60" cy="180" r="32" fill="#00D4FF"/>
    <circle cx="60" cy="180" r="28" fill="#33DDFF"/>
    <!-- Icono timbre -->
    <g transform="translate(60 180)" fill="#0F1419">
      <path d="M -10 -8 Q -10 -16 0 -16 Q 10 -16 10 -8 L 10 0 L 12 4 L -12 4 L -10 0 Z"/>
      <ellipse cx="0" cy="8" rx="3" ry="2"/>
    </g>
    <!-- Speaker grilla -->
    <g fill="#64748B">
      <rect x="35" y="225" width="50" height="2" rx="1"/>
      <rect x="35" y="231" width="50" height="2" rx="1"/>
      <rect x="35" y="237" width="50" height="2" rx="1"/>
    </g>
  </g>
  <text x="200" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Videoportero WiFi</text>
</svg>
