<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <!-- Rollo de cable -->
  <g transform="translate(200 200)">
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="#94A3B8"/>
    <ellipse cx="0" cy="-5" rx="120" ry="100" fill="#CBD5E1"/>
    <ellipse cx="0" cy="-10" rx="115" ry="95" fill="#E2E8F0"/>
    <!-- Líneas espiral -->
    <g fill="none" stroke="#64748B" stroke-width="1.5" opacity="0.6">
      <ellipse cx="0" cy="-10" rx="110" ry="90"/>
      <ellipse cx="0" cy="-10" rx="95" ry="78"/>
      <ellipse cx="0" cy="-10" rx="80" ry="65"/>
      <ellipse cx="0" cy="-10" rx="65" ry="52"/>
      <ellipse cx="0" cy="-10" rx="50" ry="40"/>
      <ellipse cx="0" cy="-10" rx="35" ry="28"/>
      <ellipse cx="0" cy="-10" rx="20" ry="16"/>
    </g>
    <!-- Centro -->
    <ellipse cx="0" cy="-10" rx="10" ry="8" fill="#475569"/>
    <!-- Punta saliendo -->
    <path d="M 115 -10 Q 140 -30 160 -20" stroke="#475569" stroke-width="3" fill="none"/>
  </g>
  <text x="200" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Cable Galvanizado 200m</text>
</svg>
