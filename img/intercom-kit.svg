<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <!-- Monitor interior (izq) -->
  <g transform="translate(30 90)">
    <rect x="0" y="0" width="200" height="160" fill="#1E293B" rx="10"/>
    <rect x="5" y="5" width="190" height="150" fill="#0F172A" rx="7"/>
    <!-- Pantalla -->
    <rect x="15" y="15" width="170" height="100" fill="#3B82F6" rx="3"/>
    <rect x="15" y="15" width="170" height="100" fill="url(#monGrad)" rx="3"/>
    <!-- Silueta persona en pantalla -->
    <circle cx="100" cy="50" r="14" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 80 88 Q 80 70 100 70 Q 120 70 120 88 L 120 110 L 80 110 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Botones -->
    <g>
      <circle cx="40" cy="135" r="9" fill="#00D4FF"/>
      <circle cx="80" cy="135" r="9" fill="#475569"/>
      <circle cx="120" cy="135" r="9" fill="#475569"/>
      <circle cx="160" cy="135" r="9" fill="#10B981"/>
    </g>
    <!-- Logo abajo -->
    <rect x="80" y="170" width="40" height="6" fill="#334155" rx="2"/>
  </g>
  <text x="130" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Monitor interior</text>

  <!-- Placa exterior (der) -->
  <g transform="translate(260 90)">
    <rect x="0" y="0" width="100" height="180" fill="#334155" rx="10"/>
    <rect x="4" y="4" width="92" height="172" fill="#475569" rx="7"/>
    <!-- Cámara superior -->
    <circle cx="50" cy="30" r="14" fill="#0F172A"/>
    <circle cx="50" cy="30" r="10" fill="#020617"/>
    <circle cx="48" cy="28" r="3" fill="#3B82F6" opacity="0.7"/>
    <!-- Speaker -->
    <g fill="#1E293B">
      <circle cx="35" cy="65" r="2"/><circle cx="45" cy="65" r="2"/><circle cx="55" cy="65" r="2"/><circle cx="65" cy="65" r="2"/>
      <circle cx="35" cy="75" r="2"/><circle cx="45" cy="75" r="2"/><circle cx="55" cy="75" r="2"/><circle cx="65" cy="75" r="2"/>
    </g>
    <!-- Botón timbre principal -->
    <circle cx="50" cy="115" r="20" fill="#00D4FF"/>
    <circle cx="50" cy="115" r="16" fill="#33DDFF"/>
    <g transform="translate(50 115)" fill="#0F1419">
      <path d="M -7 -5 Q -7 -11 0 -11 Q 7 -11 7 -5 L 7 0 L 9 3 L -9 3 L -7 0 Z"/>
      <ellipse cx="0" cy="6" rx="2" ry="1.5"/>
    </g>
    <!-- LED estado -->
    <circle cx="50" cy="155" r="3" fill="#10B981"/>
  </g>
  <text x="310" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Placa exterior</text>

  <!-- Línea conexión -->
  <path d="M 230 170 Q 245 170 245 180 L 245 180 L 260 180" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <text x="200" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Kit Videoportero</text>
</svg>
