<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(120 120)">
    <!-- Soporte trasero -->
    <circle cx="80" cy="80" r="20" fill="#94A3B8"/>
    <rect x="70" y="60" width="20" height="40" fill="#94A3B8"/>
    <!-- Cuerpo cilindrico vertical -->
    <rect x="40" y="20" width="80" height="160" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" rx="40"/>
    <!-- Parte superior con lente -->
    <circle cx="80" cy="60" r="32" fill="#1E293B"/>
    <circle cx="80" cy="60" r="26" fill="#0F172A"/>
    <circle cx="80" cy="60" r="18" fill="#0B2545"/>
    <circle cx="74" cy="54" r="4" fill="#3B82F6" opacity="0.7"/>
    <!-- LED IR -->
    <circle cx="60" cy="60" r="3" fill="#7F1D1D"/>
    <circle cx="100" cy="60" r="3" fill="#7F1D1D"/>
    <!-- Sensor PIR -->
    <ellipse cx="80" cy="120" rx="20" ry="12" fill="#1E293B"/>
    <!-- Indicador batería -->
    <rect x="60" y="150" width="40" height="14" fill="#10B981" rx="2"/>
    <rect x="100" y="153" width="3" height="8" fill="#10B981"/>
    <!-- LED estado -->
    <circle cx="80" cy="175" r="3" fill="#10B981"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Cámara con Batería</text>
</svg>
