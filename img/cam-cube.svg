<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(130 130)">
    <!-- Cuerpo cubo -->
    <rect x="0" y="20" width="140" height="120" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" rx="14"/>
    <rect x="0" y="20" width="140" height="120" fill="#FFFFFF" rx="14"/>
    <!-- Lente principal -->
    <circle cx="70" cy="80" r="35" fill="#1E293B"/>
    <circle cx="70" cy="80" r="29" fill="#0F172A"/>
    <circle cx="70" cy="80" r="22" fill="#0B2545"/>
    <circle cx="63" cy="73" r="5" fill="#3B82F6" opacity="0.7"/>
    <!-- Base inclinable -->
    <rect x="50" y="140" width="40" height="20" fill="#94A3B8" rx="3"/>
    <ellipse cx="70" cy="160" rx="45" ry="6" fill="#64748B"/>
    <!-- LED + Mic -->
    <circle cx="115" cy="35" r="3" fill="#10B981"/>
