<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(110 100)">
    <!-- Base -->
    <rect x="10" y="100" width="160" height="40" fill="#1E293B" rx="6"/>
    <rect x="20" y="110" width="140" height="20" fill="#0F172A" rx="2"/>
    <!-- Cuerpo sirena -->
    <ellipse cx="90" cy="80" rx="80" ry="60" fill="#DC2626"/>
    <ellipse cx="90" cy="75" rx="75" ry="55" fill="#EF4444"/>
    <!-- Detalle rejilla -->
    <ellipse cx="90" cy="80" rx="45" ry="35" fill="#7F1D1D"/>
    <g stroke="#450A0A" stroke-width="2" fill="none">
      <line x1="50" y1="80" x2="130" y2="80"/>
      <line x1="55" y1="65" x2="125" y2="65"/>
      <line x1="55" y1="95" x2="125" y2="95"/>
    </g>
    <!-- Reflejo -->
    <ellipse cx="65" cy="55" rx="25" ry="12" fill="#FFFFFF" opacity="0.25"/>
  </g>
  <!-- Ondas sonoras -->
  <g stroke="#DC2626" stroke-width="3" fill="none" opacity="0.4">
    <path d="M 40 180 Q 30 200 40 220"/>
    <path d="M 20 170 Q 5 200 20 230"/>
    <path d="M 360 180 Q 370 200 360 220"/>
    <path d="M 380 170 Q 395 200 380 230"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Sirena Exterior</text>
</svg>
