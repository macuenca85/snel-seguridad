<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(110 70)">
    <!-- Cuerpo terminal -->
    <rect x="0" y="0" width="180" height="280" fill="#1E293B" rx="14"/>
    <rect x="6" y="6" width="168" height="268" fill="#334155" rx="11"/>
    <!-- Cámara superior (lente facial) -->
    <circle cx="90" cy="40" r="14" fill="#0F172A"/>
    <circle cx="90" cy="40" r="10" fill="#020617"/>
    <circle cx="87" cy="37" r="3" fill="#00D4FF" opacity="0.7"/>
    <!-- LED IR -->
    <circle cx="60" cy="40" r="3" fill="#7F1D1D"/>
    <circle cx="120" cy="40" r="3" fill="#7F1D1D"/>
    <!-- Pantalla con silueta de rostro -->
    <rect x="20" y="65" width="140" height="140" fill="#0B2545" rx="6"/>
    <!-- Marco de detección facial -->
    <rect x="40" y="85" width="100" height="100" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="6 3" rx="4"/>
    <!-- Esquinas del marco -->
    <g stroke="#00D4FF" stroke-width="3" fill="none">
      <path d="M 40 95 L 40 85 L 50 85"/>
      <path d="M 130 85 L 140 85 L 140 95"/>
      <path d="M 40 175 L 40 185 L 50 185"/>
      <path d="M 130 185 L 140 185 L 140 175"/>
    </g>
    <!-- Silueta rostro -->
    <g fill="#FFFFFF" opacity="0.85">
      <circle cx="90" cy="125" r="22"/>
      <path d="M 70 165 Q 70 152 90 152 Q 110 152 110 165 L 110 175 L 70 175 Z"/>
    </g>
    <!-- Status verde -->
    <circle cx="155" cy="200" r="3" fill="#10B981"/>
    <!-- Teclado pequeño -->
    <g font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#00D4FF" text-anchor="middle">
      <circle cx="40" cy="230" r="10" fill="#0F172A"/><text x="40" y="234">#</text>
      <circle cx="90" cy="230" r="10" fill="#0F172A"/><text x="90" y="234">★</text>
      <circle cx="140" cy="230" r="10" fill="#0F172A"/><text x="140" y="234">0</text>
    </g>
    <!-- Sensor huella inferior -->
    <rect x="65" y="250" width="50" height="22" fill="#0F172A" rx="3"/>
    <g transform="translate(90 261)" stroke="#00D4FF" stroke-width="1" fill="none">
      <path d="M -10 -4 Q -10 -8 0 -8 Q 10 -8 10 -4"/>
      <path d="M -7 -1 Q -7 -5 0 -5 Q 7 -5 7 -1"/>
      <path d="M -4 2 Q -4 -2 0 -2 Q 4 -2 4 2"/>
    </g>
  </g>
  <text x="200" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Terminal Facial</text>
</svg>
