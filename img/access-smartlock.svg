<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(130 60)">
    <!-- Cuerpo cerradura -->
    <rect x="0" y="0" width="140" height="280" fill="#334155" rx="14"/>
    <rect x="5" y="5" width="130" height="270" fill="#475569" rx="12"/>
    <!-- Pantalla -->
    <rect x="20" y="20" width="100" height="50" fill="#0F172A" rx="4"/>
    <g fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">
      <text x="70" y="42">BIENVENIDO</text>
      <text x="70" y="58" font-size="9" fill="#10B981">WiFi conectado</text>
    </g>
    <!-- Teclado -->
    <g font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="middle">
      <circle cx="35" cy="100" r="12" fill="#1E293B"/><text x="35" y="105">1</text>
      <circle cx="70" cy="100" r="12" fill="#1E293B"/><text x="70" y="105">2</text>
      <circle cx="105" cy="100" r="12" fill="#1E293B"/><text x="105" y="105">3</text>
      <circle cx="35" cy="135" r="12" fill="#1E293B"/><text x="35" y="140">4</text>
      <circle cx="70" cy="135" r="12" fill="#1E293B"/><text x="70" y="140">5</text>
      <circle cx="105" cy="135" r="12" fill="#1E293B"/><text x="105" y="140">6</text>
      <circle cx="35" cy="170" r="12" fill="#1E293B"/><text x="35" y="175">7</text>
      <circle cx="70" cy="170" r="12" fill="#1E293B"/><text x="70" y="175">8</text>
      <circle cx="105" cy="170" r="12" fill="#1E293B"/><text x="105" y="175">9</text>
      <circle cx="70" cy="205" r="12" fill="#1E293B"/><text x="70" y="210">0</text>
    </g>
    <!-- Manilla -->
    <rect x="40" y="235" width="60" height="14" fill="#FBBF24" rx="7"/>
    <circle cx="70" cy="242" r="5" fill="#0B2545"/>
  </g>
  <text x="200" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Cerradura Inteligente WiFi</text>
</svg>
