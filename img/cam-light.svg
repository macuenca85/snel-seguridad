<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <g transform="translate(80 120)">
    <!-- Soporte techo -->
    <rect x="105" y="0" width="30" height="20" fill="#475569"/>
    <!-- Cuerpo bullet con luz -->
    <rect x="20" y="40" width="200" height="80" fill="#1E293B" rx="20"/>
    <!-- Sección lente -->
    <circle cx="55" cy="80" r="22" fill="#0F172A"/>
    <circle cx="55" cy="80" r="18" fill="#1E293B"/>
    <circle cx="55" cy="80" r="14" fill="#0B2545"/>
    <circle cx="50" cy="75" r="4" fill="#3B82F6" opacity="0.7"/>
    <!-- Faro LED grande -->
    <rect x="90" y="50" width="115" height="60" fill="#FFFFFF" rx="10"/>
    <rect x="95" y="55" width="105" height="50" fill="#FEF3C7" rx="8"/>
    <!-- Reflejo brillo -->
    <ellipse cx="148" cy="80" rx="40" ry="20" fill="#FFFBEB" opacity="0.9"/>
    <!-- Rayos -->
    <g stroke="#FBBF24" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="220" y1="50" x2="240" y2="40"/>
      <line x1="220" y1="80" x2="245" y2="80"/>
      <line x1="220" y1="110" x2="240" y2="120"/>
    </g>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#64748B">Cámara con Foco LED</text>
</svg>
